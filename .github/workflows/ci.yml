name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Unit · RLS · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders: the build never contacts Supabase.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Permission matrix SQL is in sync with TypeScript
        run: pnpm gen:permissions && git diff --exit-code supabase/migrations
      - run: pnpm check:consistency
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit + RLS/tenant-isolation tests (real Postgres)
        run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright E2E (Supabase local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Supabase CLI: the NEWEST release when GitHub answers (asked with this run's token → no anonymous rate limit),
      # otherwise the known-good 2.122.1. If the newest one cannot be installed, the known-good one is installed instead.
      - name: Choose the Supabase CLI version
        id: cliver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(gh api repos/supabase/cli/releases/latest --jq .tag_name 2>/dev/null | sed 's/^v//')" || true
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then v="2.122.1"; echo "::notice::Using the known-good Supabase CLI 2.122.1"; fi
          echo "Supabase CLI $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        id: clisetup
        continue-on-error: true
        with:
          version: ${{ steps.cliver.outputs.version }}
      - uses: supabase/setup-cli@v1
        if: ${{ steps.clisetup.outcome == 'failure' }}
        with:
          version: 2.122.1
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (applies migrations + seed)
        id: sbstart
        continue-on-error: true
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      # safety net: a NEWER CLI that could not start the local database → the known-good CLI starts it (fails as before if it cannot)
      - uses: supabase/setup-cli@v1
        if: ${{ steps.sbstart.outcome == 'failure' && steps.cliver.outputs.version != '2.122.1' }}
        with:
          version: 2.122.1
      - name: Start Supabase (known-good CLI)
        if: ${{ steps.sbstart.outcome == 'failure' }}
        run: |
          supabase stop --no-backup || true
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            # server-side features (public REST API, inbound webhooks, job queue, admin E2E)
            # need the LOCAL stack's service key — throwaway CI values, never production
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @scc/web build
      - run: pnpm --filter @scc/web exec playwright install --with-deps chromium
      - name: Run E2E
        run: |
          pnpm --filter @scc/web start -p 3000 &
          npx wait-on http://localhost:3000/api/health
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
