name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Unit · RLS · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders: the build never contacts Supabase.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Permission matrix SQL is in sync with TypeScript
        run: pnpm gen:permissions && git diff --exit-code supabase/migrations
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit + RLS/tenant-isolation tests (real Postgres)
        run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright E2E (Supabase local stack)
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (applies migrations + seed)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            # server-side features (public REST API, inbound webhooks, job queue, admin E2E)
            # need the LOCAL stack's service key — throwaway CI values, never production
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @scc/web build
      - run: pnpm --filter @scc/web exec playwright install --with-deps chromium
      - name: Run E2E
        run: |
          pnpm --filter @scc/web start -p 3000 &
          npx wait-on http://localhost:3000/api/health
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
