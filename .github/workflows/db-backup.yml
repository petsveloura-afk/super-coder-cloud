name: Database backup

# Weekly encrypted backup of the production database (schema + data), stored as
# a private GitHub artifact for 30 days. The Supabase Free plan has no backups.
#
# Required secrets:
#   SUPABASE_DB_URL     Session pooler connection string (same as the migrations workflow)
#   BACKUP_PASSPHRASE   long random passphrase; the dump is AES-256 encrypted with it.
#                       Without it the job refuses to upload (no unencrypted personal data).
#
# Restore (on your computer):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.tar.gz.enc -out backup.tar.gz -pass pass:"$BACKUP_PASSPHRASE"
#   tar xzf backup.tar.gz   →  schema.sql, data.sql   (apply with psql to a new database)

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::SUPABASE_DB_URL or BACKUP_PASSPHRASE not set — skipping backup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip == 'false'
        with:
          # pinned (no GitHub API lookup → no "rate limit exceeded" when GitHub throttles anonymous calls)
          version: 2.122.1
      - name: Dump schema and data
        if: steps.cfg.outputs.skip == 'false'
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only -f backup/data.sql
          tar czf backup.tar.gz -C backup .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup.tar.gz -out backup.tar.gz.enc -pass env:BACKUP_PASSPHRASE
          rm -rf backup backup.tar.gz
          ls -la backup.tar.gz.enc
      # upgrade spec A5: prove the encrypted backup can be opened and is complete before keeping it
      - name: Verify the backup (decrypt + contents)
        if: steps.cfg.outputs.skip == 'false'
        run: |
          mkdir verify
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.tar.gz.enc -out verify/b.tar.gz -pass env:BACKUP_PASSPHRASE
          tar xzf verify/b.tar.gz -C verify
          test -s verify/schema.sql || { echo "::error::schema.sql is empty"; exit 1; }
          test -s verify/data.sql || { echo "::error::data.sql is empty"; exit 1; }
          tables=$(grep -cE '^CREATE TABLE' verify/schema.sql || true)
          copies=$(grep -cE '^(COPY|INSERT INTO)' verify/data.sql || true)
          for t in organizations contacts conversations messages; do
            grep -qE "CREATE TABLE (IF NOT EXISTS )?\"?public\"?\.\"?$t\"?" verify/schema.sql || { echo "::error::table $t missing from the backup"; exit 1; }
          done
          echo "### Database backup verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- tables in schema: $tables" >> "$GITHUB_STEP_SUMMARY"
          echo "- data blocks: $copies" >> "$GITHUB_STEP_SUMMARY"
          echo "- encrypted size: $(stat -c%s backup.tar.gz.enc) bytes" >> "$GITHUB_STEP_SUMMARY"
          rm -rf verify
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.skip == 'false'
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.tar.gz.enc
          retention-days: 30
