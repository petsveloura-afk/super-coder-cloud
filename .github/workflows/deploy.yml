name: Deploy database migrations

# The Next.js app deploys through Vercel's Git integration (push → build).
# This workflow applies Supabase migrations to production on main, AFTER CI.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   Session pooler connection string, from Supabase →
#                     Connect → "Direct" → Session pooler, with the password filled in:
#                     postgresql://postgres.<project-ref>:<PASSWORD>@aws-…pooler.supabase.com:5432/postgres
#
# No Supabase access token is needed: the CLI connects straight to the database.
# If the secret is missing, the job exits with a warning instead of failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set — skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip == 'false'
      # Supabase CLI: the NEWEST release when GitHub answers (asked with this run's token → no anonymous rate limit),
      # otherwise the known-good 2.122.1. If the newest one cannot be installed, the known-good one is installed instead.
      - name: Choose the Supabase CLI version
        id: cliver
        if: steps.cfg.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(gh api repos/supabase/cli/releases/latest --jq .tag_name 2>/dev/null | sed 's/^v//')" || true
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then v="2.122.1"; echo "::notice::Using the known-good Supabase CLI 2.122.1"; fi
          echo "Supabase CLI $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        id: clisetup
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        with:
          version: ${{ steps.cliver.outputs.version }}
      - uses: supabase/setup-cli@v1
        if: ${{ (steps.cfg.outputs.skip == 'false') && steps.clisetup.outcome == 'failure' }}
        with:
          version: 2.122.1
      - name: Show migration status
        if: steps.cfg.outputs.skip == 'false'
        # information only — never stops the migrations below
        continue-on-error: true
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        id: apply
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      # safety net: a NEWER CLI that could not apply the migrations → the known-good CLI applies them (db push only applies
      # what is missing, so a second run never repeats anything). If this fails too, the job fails as before.
      - uses: supabase/setup-cli@v1
        if: ${{ steps.cfg.outputs.skip == 'false' && steps.apply.outcome == 'failure' && steps.cliver.outputs.version != '2.122.1' }}
        with:
          version: 2.122.1
      - name: Apply migrations (known-good CLI)
        if: ${{ steps.cfg.outputs.skip == 'false' && steps.apply.outcome == 'failure' }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      # wave 44: starts the 30-second Facebook / Instagram message clock inside the database (Supabase pg_cron + pg_net),
      # so customers' messages are fetched and answered even when nobody is logged in. Safe to repeat on every deploy
      # (it replaces its own job). Needs the CRON_SECRET repo secret (the same one the other jobs use); never fails the deploy.
      - name: Start the Facebook / Instagram message clock (every 30 seconds)
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET secret not set — the 30-second clock was not started."; exit 0; fi
          URL="${APP_URL:-https://app.supercoder.agency}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v url="$URL" -v secret="$CRON_SECRET" -q -t -f - <<'SQL'
          select public.schedule_meta_inbound_sync(:'url', :'secret');
          SQL
      # upgrade: every background job also runs from the database clock (GitHub schedules are often hours late).
      # Safe to repeat on every deploy (replaces its own jobs); never fails the deploy.
      - name: Start the background job clock (every 2-10 minutes, inside the database)
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET secret not set — the job clock was not started."; exit 0; fi
          URL="${APP_URL:-https://app.supercoder.agency}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v url="$URL" -v secret="$CRON_SECRET" -q -t -f - <<'SQL'
          select public.schedule_platform_jobs(:'url', :'secret');
          SQL
      # the digital team's clock (every 5 minutes, inside the database). Safe to repeat; never fails the deploy.
      - name: Start the digital team clock
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET secret not set — the team clock was not started."; exit 0; fi
          URL="${APP_URL:-https://app.supercoder.agency}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v url="$URL" -v secret="$CRON_SECRET" -q -t -f - <<'SQL'
          select public.schedule_team_job(:'url', :'secret');
          SQL
