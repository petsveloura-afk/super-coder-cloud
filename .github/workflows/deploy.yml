name: Deploy database migrations

# The Next.js app deploys through Vercel's Git integration (push → build).
# This workflow applies Supabase migrations to production on main, AFTER CI.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   Session pooler connection string, from Supabase →
#                     Connect → "Direct" → Session pooler, with the password filled in:
#                     postgresql://postgres.<project-ref>:<PASSWORD>@aws-…pooler.supabase.com:5432/postgres
#
# No Supabase access token is needed: the CLI connects straight to the database.
# If the secret is missing, the job exits with a warning instead of failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set — skipping migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip == 'false'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip == 'false'
        with:
          version: latest
      - name: Show migration status
        if: steps.cfg.outputs.skip == 'false'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        if: steps.cfg.outputs.skip == 'false'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      # wave 44: starts the 30-second Facebook / Instagram message clock inside the database (Supabase pg_cron + pg_net),
      # so customers' messages are fetched and answered even when nobody is logged in. Safe to repeat on every deploy
      # (it replaces its own job). Needs the CRON_SECRET repo secret (the same one the other jobs use); never fails the deploy.
      - name: Start the Facebook / Instagram message clock (every 30 seconds)
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET secret not set — the 30-second clock was not started."; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v url="$URL" -v secret="$CRON_SECRET" -q -t -f - <<'SQL'
          select public.schedule_meta_inbound_sync(:'url', :'secret');
          SQL
