name: Automation jobs

# Sweeps the automation / webhook job queue every 5 minutes (retries with
# backoff, delayed actions, deliveries that were not sent right away).
# Jobs are normally sent within seconds of the triggering action; this is the
# safety net. Requires repo secrets CRON_SECRET (same value as on Vercel) and
# optionally APP_URL (default https://super-coder-cloud.vercel.app).
# GitHub may delay scheduled runs by a few minutes under load.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: automation-jobs
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Dispatch queued jobs
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set — skipping"; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          code=$(curl -s -o out.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/jobs/dispatch" || true)
          cat out.json || true; echo
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "::warning::Job dispatch returned HTTP $code"
          fi
      - name: Read new e-mails of connected mailboxes
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set — skipping"; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          code=$(curl -s -o mail.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/channels/email/poll" || true)
          cat mail.json || true; echo
          if [ "$code" != "200" ] && [ "$code" != "503" ] && [ "$code" != "404" ]; then
            echo "::warning::Mailbox poll returned HTTP $code"
          fi
      - name: AI agent follow-ups
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set — skipping"; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          code=$(curl -s -o fu.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/ai/followups" || true)
          cat fu.json || true; echo
          if [ "$code" != "200" ] && [ "$code" != "503" ] && [ "$code" != "404" ]; then
            echo "::warning::AI follow-ups returned HTTP $code"
          fi
      - name: Prepaid plans (expiry + renewal reminders)
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set — skipping"; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          curl -s -o sweep.json -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/billing/sweep" || true
          cat sweep.json || true; echo
      - name: Growth tasks (task & meeting reminders, scores, calendars, A/B tests, conversions)
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set — skipping"; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          code=$(curl -s -o growth.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/cron/growth" || true)
          cat growth.json || true; echo
          if [ "$code" != "200" ] && [ "$code" != "503" ] && [ "$code" != "404" ]; then
            echo "::warning::Growth tasks returned HTTP $code"
          fi
      - name: AI agents (marketing, sales manager, daily brief, collections, reviews, stores, social posts)
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set — skipping"; exit 0; fi
          URL="${APP_URL:-https://super-coder-cloud.vercel.app}"
          code=$(curl -s -o agents.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/cron/agents" || true)
          cat agents.json || true; echo
          if [ "$code" != "200" ] && [ "$code" != "503" ] && [ "$code" != "404" ]; then
            echo "::warning::AI agents returned HTTP $code"
          fi
