<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Super Coder Cloud — אין חיבור</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #080d19; color: #f8fafc;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
      .card { max-width: 380px; border: 1px solid #24324d; background: #111a2b; border-radius: 20px; padding: 32px 24px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #9cafc7; font-size: 14px; line-height: 1.6; margin: 0 0 6px; }
      button { margin-top: 20px; background: #477bff; color: #fff; border: 0; border-radius: 12px; height: 44px; padding: 0 20px; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon.svg" width="56" height="56" alt="" />
      <h1>אין חיבור לאינטרנט</h1>
      <p>התוכן יחזור ברגע שהחיבור יתחדש.</p>
      <p dir="ltr">You're offline · أنت غير متصل</p>
      <button onclick="location.reload()">נסו שוב</button>
    </div>
  </body>
</html>
